<style>
:root{
  --sea:#DCE8ED; --sea-line:#C7D8DF; --land:#ECE3C8; --land-has:#E0CF9E; --land-hover:#D9C690; --land-sel:#C9B272; --coast:#A8976A;
  --ink:#1B2A3A; --muted:#5B6877; --panel:#FFFFFF; --panel-2:#F4F7F8; --line:#D6DEE3; --accent:#1D4E89; --accent-ink:#FFFFFF; --warn:#B42318;
  --shadow:0 6px 24px rgba(27,42,58,.14);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --sea:#13212C; --sea-line:#1C2E3B; --land:#2C3642; --land-has:#3A4656; --land-hover:#465468; --land-sel:#566780; --coast:#5D6B7C;
  --ink:#E4EAF0; --muted:#9AA7B4; --panel:#18222C; --panel-2:#1E2A35; --line:#2C3A47; --accent:#6EA8E8; --accent-ink:#0E1A26; --warn:#F07167;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark; }}
:root[data-theme="dark"]{
  --sea:#13212C; --sea-line:#1C2E3B; --land:#2C3642; --land-has:#3A4656; --land-hover:#465468; --land-sel:#566780; --coast:#5D6B7C;
  --ink:#E4EAF0; --muted:#9AA7B4; --panel:#18222C; --panel-2:#1E2A35; --line:#2C3A47; --accent:#6EA8E8; --accent-ink:#0E1A26; --warn:#F07167;
  --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--panel);color:var(--ink);font:15px/1.45 Barlow,"Segoe UI",Roboto,system-ui,sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font:600 22px/1.1 "Barlow Condensed",Barlow,sans-serif;margin:0;letter-spacing:.2px}
.sync{font-size:13px;color:var(--muted)}
.hdr-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font-weight:500;font-size:14px}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.btn[disabled]{opacity:.5;cursor:not-allowed}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.mapwrap{position:relative;min-height:0;background:var(--sea);overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#map.picking{cursor:crosshair}
.prov{fill:var(--land);stroke:var(--coast);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .12s}
.prov.has{fill:var(--land-has)}
.prov:hover{fill:var(--land-hover)}
.prov.sel{fill:var(--land-sel)}
.kab{fill:transparent;stroke:none;cursor:pointer}
.kab:hover{fill:rgba(120,90,20,.14)}
#map.zk .kab{stroke:var(--coast);stroke-width:.35;stroke-opacity:.7;vector-effect:non-scaling-stroke}
#map.zk .kab.has{fill:rgba(160,110,20,.16)}
.kab.sel,#map.zk .kab.sel{fill:rgba(29,78,137,.22)}
.grid line{stroke:var(--sea-line);vector-effect:non-scaling-stroke;stroke-width:1}
.mk{cursor:pointer}
.mk.dim{opacity:.45}
.draft{fill:none;stroke:var(--ink);stroke-dasharray:3 2}

.zoom{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.zoom button{border:0;background:none;width:36px;height:34px;font-size:18px;line-height:1}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--panel-2)}
.legend{position:absolute;right:12px;bottom:12px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;max-width:calc(100% - 80px)}
.legend summary{cursor:pointer;font-weight:600}
.legend ul{list-style:none;margin:6px 0 0;padding:0;columns:2;column-gap:16px}
.legend li{display:flex;align-items:center;gap:6px;break-inside:avoid;padding:1px 0}
.sw{width:10px;height:10px;border-radius:50%;flex:none}
.sw.ring{background:var(--panel)!important;border:2.5px solid}
.legend .shapes{display:flex;gap:14px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--muted)}
.legend .shapes span{display:flex;align-items:center;gap:6px}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:6px 12px;border-radius:6px;font-size:14px;box-shadow:var(--shadow);white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-size:13px;padding:3px 8px;border-radius:4px;transform:translate(-50%,calc(-100% - 10px));white-space:nowrap}
.pop{position:absolute;z-index:5;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:12px;font-size:14px}
.pop h3{margin:0 0 2px;font:600 18px/1.2 "Barlow Condensed",Barlow,sans-serif}
.pop .coord{color:var(--muted);font-size:13px;margin-bottom:8px}
.pop .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pop .x{position:absolute;right:6px;top:4px;border:0;background:none;font-size:18px;color:var(--muted)}

aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.filters{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters input[type=search]{grid-column:1/-1}
.filters input,.filters select{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--panel)}
.chip{grid-column:1/-1;display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:6px;padding:5px 6px 5px 10px;font-size:14px}
.chip button{margin-left:auto;border:0;background:none;font-size:16px;color:var(--muted)}
.stats{grid-column:1/-1;font-size:13px;color:var(--muted)}
.list{flex:1;overflow:auto;padding:4px 0}
.item{display:grid;grid-template-columns:12px 1fr auto;gap:4px 10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px}
.item:hover{background:var(--panel-2)}
.item.sel{background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.item .sw{margin-top:5px}
.item .nm{font-weight:600;line-height:1.25}
.item .meta{grid-column:2/4;font-size:13px;color:var(--muted)}
.badge{font-size:12px;padding:1px 7px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap;align-self:start}
.badge.s-menang{border-color:#2E7D32;color:#2E7D32}
.badge.s-batal,.badge.s-selesai{opacity:.7}
.due{color:var(--warn);font-weight:500}
.empty{padding:28px 18px;color:var(--muted);text-align:center}

.editor{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(105%);transition:transform .2s ease}
.editor.open{transform:none}
.ed-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ed-head h2{margin:0;font:600 20px/1.2 "Barlow Condensed",Barlow,sans-serif;flex:1}
.ed-head .x{border:0;background:none;font-size:22px;color:var(--muted)}
.ed-body{flex:1;overflow:auto;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;align-content:start}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.f.full{grid-column:1/-1}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--panel);color:var(--ink);font-size:15px;width:100%}
.f textarea{min-height:90px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:7px 0;cursor:pointer;color:var(--ink);font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.locrow{grid-column:1/-1;display:flex;gap:8px;align-items:end}
.locrow .f{flex:1}
.ed-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.ed-foot .sp{flex:1}
.stamp{grid-column:1/-1;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:6px;font-size:14px;z-index:30;box-shadow:var(--shadow)}
.modal{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal-card{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);padding:20px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px}
.modal-card h2{margin:0;font:600 22px/1.2 "Barlow Condensed",Barlow,sans-serif}
.modal-card p{margin:0;color:var(--muted);font-size:14px}
.modal-card .row{display:flex;justify-content:flex-end;gap:8px}
.err{color:var(--warn);font-size:14px}
[hidden]{display:none!important}

@media (max-width:820px){
  body{height:auto;min-height:100%}
  main{display:block}
  .mapwrap{height:44vh;min-height:280px}
  aside{border-left:0;border-top:1px solid var(--line)}
  .list{overflow:visible}
  .legend ul{columns:1}
  h1{font-size:20px}
}
@media (prefers-reduced-motion:reduce){.editor,.prov{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Peta proyek & peluang Indonesia</h1>
  <span class="sync" id="sync">Memuat data…</span>
  <div class="hdr-actions">
    <button class="btn" id="btnImport" title="Impor dari CSV" hidden>Impor CSV</button>
    <button class="btn" id="btnExport">Ekspor CSV</button>
    <button class="btn primary" id="btnAdd" hidden>Tambah entri</button>
    <button class="btn" id="btnLogin">Masuk</button>
    <button class="btn" id="btnLogout" hidden>Keluar</button>
    <input type="file" id="fileIn" accept=".csv,text/csv" hidden>
  </div>
</header>
<main>
  <div class="mapwrap" id="wrap">
    <svg id="map" role="application" aria-label="Peta Indonesia. Klik untuk memilih lokasi, seret untuk menggeser, gulir untuk zoom.">
      <g id="root"><g class="grid" id="grid"></g><g id="land"></g><g id="kabs"></g><g id="draft"></g><g id="marks"></g></g>
    </svg>
    <div class="hint" id="hint" hidden></div>
    <div class="tip" id="tip" hidden></div>
    <div class="pop" id="pop" hidden></div>
    <div class="zoom">
      <button id="zin" aria-label="Perbesar">+</button>
      <button id="zout" aria-label="Perkecil">−</button>
      <button id="zfit" aria-label="Tampilkan seluruh Indonesia" style="font-size:14px">⤢</button>
    </div>
    <details class="legend" id="legend" open><summary>Legenda</summary><ul id="legendList"></ul>
      <div class="shapes"><span><i class="sw" style="background:var(--ink)"></i>Proyek</span><span><i class="sw ring" style="border-color:var(--ink)"></i>Peluang</span></div>
    </details>
  </div>
  <aside>
    <div class="filters">
      <input type="search" id="q" placeholder="Cari nama, klien, mitra, catatan" aria-label="Cari">
      <select id="fKind" aria-label="Jenis"><option value="">Semua jenis</option></select>
      <select id="fStatus" aria-label="Status"><option value="">Semua status</option></select>
      <select id="fSector" aria-label="Sektor"><option value="">Semua sektor</option></select>
      <select id="fStage" aria-label="Tahap tender"><option value="">Semua tahap</option></select>
      <div class="chip" id="provChip" hidden><span id="provChipTxt"></span><button id="provClear" aria-label="Hapus filter provinsi">×</button></div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
</main>

<div class="editor" id="editor" aria-hidden="true">
  <div class="ed-head"><h2 id="edTitle">Entri baru</h2><button class="x" id="edClose" aria-label="Tutup">×</button></div>
  <form class="ed-body" id="form" autocomplete="off">
    <label class="f full">Nama proyek / peluang<input name="name" required maxlength="200"></label>
    <div class="f full">Jenis<div class="seg" id="segKind"></div></div>
    <label class="f">Sektor<select name="sector" id="edSector"></select></label>
    <label class="f">Status<select name="status" id="edStatus"></select></label>
    <label class="f">Tahap tender<select name="stage" id="edStage"></select></label>
    <label class="priv f">Probabilitas menang (%)<input name="prob" type="number" min="0" max="100" step="5" inputmode="numeric" placeholder="0–100"></label>
    <label class="f">Klien / pemilik<input name="client" maxlength="200"></label>
    <label class="f">Mitra<input name="partner" maxlength="200"></label>
    <label class="priv f">Nilai estimasi<input name="value" inputmode="decimal" placeholder="contoh 1880000000"></label>
    <label class="priv f">Mata uang<select name="currency"><option>IDR</option><option>USD</option><option>EUR</option></select></label>
    <label class="f">Tenggat<input name="deadline" type="date"></label>
    <label class="priv f">PIC<input name="pic" maxlength="100"></label>
    <label class="f">Provinsi<select name="province" id="edProv"></select></label>
    <label class="f">Kabupaten / kota<select name="regency" id="edKab"></select></label>
    <div class="locrow">
      <label class="f">Lintang<input name="lat" inputmode="decimal" placeholder="-6.02"></label>
      <label class="f">Bujur<input name="lon" inputmode="decimal" placeholder="105.95"></label>
      <button type="button" class="btn" id="btnPick">Pilih di peta</button>
    </div>
    <label class="priv f full">Catatan<textarea name="notes" maxlength="4000"></textarea></label>
    <div class="stamp" id="stamp"></div>
  </form>
  <div class="ed-foot">
    <button class="btn danger" id="btnDel" hidden>Hapus</button>
    <span class="sp"></span>
    <button class="btn" id="btnCancel">Batal</button>
    <button class="btn primary" id="btnSave">Simpan</button>
  </div>
</div>
<div class="modal" id="loginModal" hidden>
  <form class="modal-card" id="loginForm">
    <h2>Masuk untuk mengedit</h2>
    <p>Hanya anggota tim yang terdaftar yang dapat menambah dan mengubah data.</p>
    <label class="f">Email<input name="email" type="email" required autocomplete="username"></label>
    <label class="f">Kata sandi<input name="password" type="password" required autocomplete="current-password"></label>
    <div class="err" id="loginErr" hidden></div>
    <div class="row"><button type="button" class="btn" id="loginCancel">Batal</button><button class="btn primary" id="loginGo">Masuk</button></div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

const provEls={},kabEls=[];const gKab=$('#kabs');
function buildMap(){
  for(let lon=70;lon<=165;lon+=5){const[x]=proj(lon,0);const l=document.createElementNS(NS,'line');l.setAttribute('x1',x);l.setAttribute('x2',x);l.setAttribute('y1',-600);l.setAttribute('y2',H+600);gGrid.appendChild(l)}
  for(const lat of [25,20,15,10,5,0,-5,-10,-15,-20,-25,-30]){const[,y]=proj(100,lat);const l=document.createElementNS(NS,'line');l.setAttribute('x1',-600);l.setAttribute('x2',W+600);l.setAttribute('y1',y);l.setAttribute('y2',y);gGrid.appendChild(l)}
  for(const p of PROV){const el=document.createElementNS(NS,'path');el.setAttribute('d',p.d);el.setAttribute('class','prov');el.dataset.prov=p.n;gLand.appendChild(el);provEls[p.n]=el}
  for(const k of KAB){const el=document.createElementNS(NS,'path');el.setAttribute('d',k.d);el.setAttribute('class','kab');el.dataset.kab=k.n;el.dataset.prov=k.p;gKab.appendChild(el);kabEls.push(el)}
}
function fit(){
  const r=$('#wrap').getBoundingClientRect();
  svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);
  fitK=Math.min(r.width/W,r.height/H)*0.96;
  view={k:fitK,x:(r.width-W*fitK)/2,y:(r.height-H*fitK)/2};
  apply();
}
function apply(){svg.classList.toggle('zk',view.k>fitK*2.6);gRoot.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`);renderMarkers();hidePop()}
function zoomAt(px,py,f){
  const nk=Math.max(fitK*.8,Math.min(fitK*60,view.k*f));const r=nk/view.k;
  view.x=px-(px-view.x)*r;view.y=py-(py-view.y)*r;view.k=nk;apply();
}
function flyTo(lon,lat,k){
  const r=$('#wrap').getBoundingClientRect();const[x,y]=proj(lon,lat);
  view.k=Math.max(view.k,k||fitK*4);view.x=r.width/2-x*view.k;view.y=r.height/2-y*view.k;apply();
}
const toMap=(px,py)=>[(px-view.x)/view.k,(py-view.y)/view.k];
const localPt=e=>{const r=svg.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};

let kabBoxes=null;
function regionAt(mx,my_,target){
  if(target&&target.dataset&&target.dataset.kab)return{prov:target.dataset.prov,kab:target.dataset.kab,sea:false};
  let pt;try{pt=svg.createSVGPoint()}catch(e){return{prov:'',kab:'',sea:true}}
  if(!kabBoxes)kabBoxes=kabEls.map(el=>{try{return el.getBBox()}catch(e){return null}});
  const inside=(x,y)=>{pt.x=x;pt.y=y;for(let i=0;i<kabEls.length;i++){const b=kabBoxes[i];if(!b||x<b.x||x>b.x+b.width||y<b.y||y>b.y+b.height)continue;try{if(kabEls[i].isPointInFill(pt))return kabEls[i]}catch(e){}}return null};
  let el=inside(mx,my_); if(el)return{prov:el.dataset.prov,kab:el.dataset.kab,sea:false};
  for(const rad of [1,2,3.5,5,7,10,14,20,28,38,50]){for(let a=0;a<16;a++){const th=a*Math.PI/8;el=inside(mx+rad*Math.cos(th),my_+rad*Math.sin(th));if(el)return{prov:el.dataset.prov,kab:el.dataset.kab,sea:true}}}
  return{prov:'',kab:'',sea:true};
}

function renderMarkers(){
  gMarks.textContent='';gDraft.textContent='';
  const R=6.5/view.k, SW=2.4/view.k;
  const list=filtered().filter(i=>isFinite(i.lat)&&isFinite(i.lon)&&i.lat!==null&&i.lon!==null);
  list.sort((a,b)=>(a.id===selectedId)-(b.id===selectedId));
  for(const it of list){
    const[x,y]=proj(+it.lon,+it.lat);const c=sec(it.sector).c;
    const g=document.createElementNS(NS,'g');g.setAttribute('class','mk'+((it.status==='batal'||it.status==='selesai')?' dim':''));g.dataset.id=it.id;
    if(it.id===selectedId){const h=document.createElementNS(NS,'circle');h.setAttribute('cx',x);h.setAttribute('cy',y);h.setAttribute('r',R*2.1);h.setAttribute('fill',c);h.setAttribute('opacity','.25');g.appendChild(h)}
    const ci=document.createElementNS(NS,'circle');ci.setAttribute('cx',x);ci.setAttribute('cy',y);
    if(it.kind==='peluang'){ci.setAttribute('r',R*.85);ci.setAttribute('fill','var(--panel)');ci.setAttribute('stroke',c);ci.setAttribute('stroke-width',SW*1.3)}
    else{ci.setAttribute('r',R);ci.setAttribute('fill',c);ci.setAttribute('stroke','var(--panel)');ci.setAttribute('stroke-width',SW*.7)}
    g.appendChild(ci);gMarks.appendChild(g);
  }
  if(draft){const[x,y]=proj(draft.lon,draft.lat);const ci=document.createElementNS(NS,'circle');ci.setAttribute('cx',x);ci.setAttribute('cy',y);ci.setAttribute('r',R*1.4);ci.setAttribute('class','draft');ci.setAttribute('stroke-width',1.6/view.k);gDraft.appendChild(ci)}
  const has=new Set([...items.values()].map(i=>i.province));
  for(const n in provEls){provEls[n].classList.toggle('has',has.has(n));provEls[n].classList.toggle('sel',filters.prov===n&&!filters.kab)}
  const hasK=new Set([...items.values()].map(i=>i.regency));
  for(const el of kabEls){const k=el.dataset.kab;el.classList.toggle('has',hasK.has(k));el.classList.toggle('sel',filters.kab===k)}
}

/* pointer: drag, pinch, click */
const ptrs=new Map();let drag=null,pinch=null;
svg.addEventListener('pointerdown',e=>{
  svg.setPointerCapture(e.pointerId);const p=localPt(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===1)drag={sx:p[0],sy:p[1],vx:view.x,vy:view.y,moved:false,target:e.target};
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),k:view.k};if(drag)drag.moved=true}
});
svg.addEventListener('pointermove',e=>{
  const p=localPt(e);
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,p);
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2;zoomAt(cx,cy,(pinch.k*d/pinch.d)/view.k);return}
  if(drag&&ptrs.size===1){const dx=p[0]-drag.sx,dy=p[1]-drag.sy;if(!drag.moved&&Math.hypot(dx,dy)>5)drag.moved=true;if(drag.moved){view.x=drag.vx+dx;view.y=drag.vy+dy;gRoot.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`);hidePop();hideTip()}return}
  if(e.pointerType==='mouse')showTip(e,p);
});
function endPtr(e){
  const p=ptrs.get(e.pointerId)||localPt(e);ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===0&&drag){const d=drag;drag=null;if(!d.moved&&e.type==='pointerup')handleClick(p[0],p[1],d.target)}
}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('pointerleave',hideTip);
svg.addEventListener('wheel',e=>{e.preventDefault();const p=localPt(e);zoomAt(p[0],p[1],Math.exp(-e.deltaY*0.0018))},{passive:false});
$('#zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1.6)};
$('#zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1/1.6)};
$('#zfit').onclick=fit;

function showTip(e,p){
  const mk=e.target.closest&&e.target.closest('.mk');const tip=$('#tip');
  let txt='';
  if(mk){const it=items.get(mk.dataset.id);if(it)txt=it.name}
  else if(e.target.dataset&&e.target.dataset.kab){txt=e.target.dataset.kab+', '+e.target.dataset.prov}else if(e.target.dataset&&e.target.dataset.prov){txt=e.target.dataset.prov}
  if(!txt){hideTip();return}
  tip.textContent=txt;tip.style.left=p[0]+'px';tip.style.top=p[1]+'px';tip.hidden=false;
}
function hideTip(){$('#tip').hidden=true}

function handleClick(px,py,target){
  hideTip();
  const mk=target&&target.closest&&target.closest('.mk');
  if(mk&&!pickMode){select(mk.dataset.id,true);return}
  const[mx,my_]=toMap(px,py);if(mx<-40||mx>W+40||my_<-40||my_>H+40)return;
  const[lon,lat]=unproj(mx,my_);const pv=regionAt(mx,my_,target);
  if(pickMode){
    pickMode=false;svg.classList.remove('picking');$('#hint').hidden=true;
    const f=$('#form');f.lat.value=lat.toFixed(4);f.lon.value=lon.toFixed(4);if(pv.prov){f.province.value=pv.prov;fillKab(pv.prov,pv.kab)}
    draft={lat,lon};renderMarkers();openEditorPanel();return;
  }
  draft={lat,lon};renderMarkers();
  const nK=pv.kab?[...items.values()].filter(i=>i.regency===pv.kab).length:0;
  const nP=pv.prov?[...items.values()].filter(i=>i.province===pv.prov).length:0;
  const pop=$('#pop');
  const title=pv.kab?(pv.sea?`Perairan dekat ${pv.kab}`:pv.kab):'Perairan';
  const btn=(a,l,p)=>`<button class="btn${p?' primary':''}" data-a="${a}">${l}</button>`;
  pop.innerHTML=`<button class="x" aria-label="Tutup">×</button><h3>${esc(title)}</h3>
   <div class="coord">${pv.prov?esc('Provinsi '+pv.prov)+'<br>':''}${lat.toFixed(3)}, ${lon.toFixed(3)}${pv.kab?`<br>${nK} entri di kabupaten/kota ini, ${nP} di provinsi`:''}</div>
   <div class="row">${canWrite?btn('add','Tambah di sini',1):''}
   ${pv.kab?(filters.kab===pv.kab?btn('unf','Lihat semua'):btn('fk','Saring kab/kota')):''}
   ${pv.prov&&!(filters.prov===pv.prov&&!filters.kab)?btn('fp','Saring provinsi'):''}</div>`;
  const r=$('#wrap').getBoundingClientRect();
  pop.style.left=Math.max(8,Math.min(px+12,r.width-262))+'px';pop.style.top=Math.max(8,Math.min(py+12,r.height-150))+'px';pop.hidden=false;
  pop.querySelector('.x').onclick=()=>{hidePop();draft=null;renderMarkers()};
  pop.onclick=ev=>{const a=ev.target.dataset&&ev.target.dataset.a;if(!a)return;
    if(a==='add'){hidePop();openEditor(null,{lat,lon,province:pv.prov,regency:pv.kab})}
    if(a==='fk'){filters.prov=pv.prov;filters.kab=pv.kab;hidePop();draft=null;renderAll()}
    if(a==='fp'){filters.prov=pv.prov;filters.kab='';hidePop();draft=null;renderAll()}
    if(a==='unf'){filters.prov='';filters.kab='';hidePop();draft=null;renderAll()}};
}
function hidePop(){$('#pop').hidden=true}

/* ---------- list & filters ---------- */
function filtered(){
  const q=filters.q.trim().toLowerCase();
  return [...items.values()].filter(i=>(!filters.kind||i.kind===filters.kind)&&(!filters.sector||i.sector===filters.sector)&&(!filters.status||i.status===filters.status)&&(filters.stage===null||(i.stage||'')===filters.stage)&&(!filters.prov||i.province===filters.prov)&&(!filters.kab||i.regency===filters.kab)&&(!q||[i.name,i.client,i.partner,i.notes,i.pic,i.province,i.regency].join(' ').toLowerCase().includes(q)));
}
function fmtVal(v,c){if(v===null||v===undefined||v===''||!isFinite(v))return'';try{return new Intl.NumberFormat('id-ID',{style:'currency',currency:c||'IDR',notation:'compact',maximumFractionDigits:2}).format(v)}catch(e){return v+' '+(c||'')}}
function fmtDate(d){if(!d)return'';const t=new Date(d+'T00:00:00');return isNaN(t)?d:t.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
function isDue(it){if(!it.deadline||it.status==='selesai'||it.status==='batal')return false;const t=new Date(it.deadline+'T00:00:00')-new Date();return t<14*864e5}
function renderList(){
  const L=filtered().sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  const all=items.size;
  const pel=L.filter(i=>i.kind==='peluang').length;
  const wsum={};for(const i of L){if(i.status==='batal'||i.status==='selesai')continue;if(isFinite(i.value)&&i.value!==null&&isFinite(i.prob)&&i.prob!==null){const c=i.currency||'IDR';wsum[c]=(wsum[c]||0)+i.value*i.prob/100}}
  const wtxt=Object.entries(wsum).map(([c,v])=>fmtVal(v,c)).join(' + ');
  $('#stats').textContent=all?`${L.length} dari ${all} entri: ${pel} peluang, ${L.length-pel} proyek`+(wtxt?`. Nilai tertimbang aktif: ${wtxt}`:''):'';
  $('#provChip').hidden=!filters.prov&&!filters.kab;$('#provChipTxt').textContent=filters.kab?`${filters.kab}, ${filters.prov}`:'Provinsi: '+filters.prov;
  const el=$('#list');
  if(mode==='loading'){el.innerHTML='<div class="empty">Memuat data…</div>';return}
  if(!all){el.innerHTML=`<div class="empty">Belum ada entri.${canWrite?' Klik di mana saja pada peta untuk menambahkan proyek atau peluang pertama.':''}</div>`;return}
  if(!L.length){el.innerHTML='<div class="empty">Tidak ada entri yang cocok dengan filter ini.</div>';return}
  el.innerHTML=L.map(i=>{const s=sec(i.sector);const meta=[s.label,[i.regency,i.province].filter(Boolean).join(', ')||(isFinite(i.lat)&&i.lat!==null?'Tanpa provinsi':'Belum ada lokasi'),i.client,fmtVal(i.value,i.currency)].filter(Boolean).map(esc).join(', ');
    const pr=(i.stage||isFinite(i.prob)&&i.prob!==null)?`<br>${esc([i.stage?stageLabel(i.stage):'',isFinite(i.prob)&&i.prob!==null?`peluang menang ${i.prob}%`:''].filter(Boolean).join(', '))}`:'';
    const due=i.deadline?`<br><span class="${isDue(i)?'due':''}">Tenggat ${esc(fmtDate(i.deadline))}</span>`:'';
    return `<button class="item${i.id===selectedId?' sel':''}" data-id="${esc(i.id)}"><i class="sw${i.kind==='peluang'?' ring':''}" style="${i.kind==='peluang'?'border-color':'background'}:${s.c}"></i><span class="nm">${esc(i.name||'(tanpa nama)')}</span><span class="badge s-${esc(i.status)}">${esc(stLabel(i.status))}</span><span class="meta">${kindLabel(i.kind)}: ${meta}${pr}${due}</span></button>`}).join('');
}
$('#list').onclick=e=>{const b=e.target.closest('.item');if(b)select(b.dataset.id,false,true)};
function renderAll(){renderList();renderMarkers();setSync()}
function select(id,fromMap,fly){
  selectedId=id;const it=items.get(id);draft=null;hidePop();
  if(it&&fly&&isFinite(it.lat)&&it.lat!==null)flyTo(+it.lon,+it.lat);
  renderAll();openEditor(id);
  if(fromMap){const b=document.querySelector(`.item[data-id="${CSS.escape(id)}"]`);b&&b.scrollIntoView({block:'nearest'})}
}
function fillSelect(sel,arr,first){sel.innerHTML=(first!==undefined?`<option value="">${first}</option>`:'')+arr.map(a=>`<option value="${esc(a.id)}">${esc(a.label)}</option>`).join('')}
function initFilters(){
  fillSelect($('#fKind'),KINDS,'Semua jenis');fillSelect($('#fStatus'),STATUSES,'Semua status');fillSelect($('#fSector'),SECTORS,'Semua sektor');
  fillSelect($('#edSector'),SECTORS);fillSelect($('#edStage'),STAGES);$('#fStage').innerHTML='<option value="*">Semua tahap</option>'+STAGES.map(a=>`<option value="${esc(a.id)}">${esc(a.label)}</option>`).join('');fillSelect($('#edStatus'),STATUSES);
  $('#edProv').innerHTML='<option value="">Belum ditentukan</option>'+PROVNAMES.map(n=>`<option>${esc(n)}</option>`).join('');
  $('#edProv').onchange=e=>fillKab(e.target.value,'');
  $('#segKind').innerHTML=KINDS.map((k,i)=>`<label><input type="radio" name="kind" value="${k.id}"${i===0?' checked':''}>${k.label}</label>`).join('');
  $('#legendList').innerHTML=SECTORS.map(s=>`<li><i class="sw" style="background:${s.c}"></i>${esc(s.label)}</li>`).join('');
  $('#q').oninput=e=>{filters.q=e.target.value;renderAll()};
  $('#fKind').onchange=e=>{filters.kind=e.target.value;renderAll()};
  $('#fStatus').onchange=e=>{filters.status=e.target.value;renderAll()};
  $('#fSector').onchange=e=>{filters.sector=e.target.value;renderAll()};
  $('#fStage').onchange=e=>{filters.stage=e.target.value==='*'?null:e.target.value;renderAll()};
  $('#provClear').onclick=()=>{filters.prov='';filters.kab='';renderAll()};
  if(window.innerWidth<820)$('#legend').open=false;
}

/* ---------- editor ---------- */
const form=$('#form');
function fillKab(prov,val){
  const sel=$('#edKab');const list=KABLIST[prov]||[];
  sel.innerHTML=`<option value="">${prov?'Belum ditentukan':'Pilih provinsi dulu'}</option>`+list.map(n=>`<option>${esc(n)}</option>`).join('');
  if(val&&!list.includes(val)){const o=document.createElement('option');o.textContent=val;sel.appendChild(o)}
  sel.value=val||'';
}
function openEditorPanel(){const ed=$('#editor');ed.classList.add('open');ed.setAttribute('aria-hidden','false')}
function openEditor(id,preset){
  editingId=id;const it=id?items.get(id):null;
  form.reset();delConfirm=false;$('#btnDel').textContent='Hapus';
  const v=it||Object.assign({kind:'peluang',sector:'lng',status:'identifikasi',currency:'IDR'},preset||{});
  for(const k of FIELDS){if(k==='kind'){form.querySelectorAll('input[name=kind]').forEach(r=>r.checked=r.value===(v.kind||'peluang'));continue}
    if(k==='regency')continue;
    const el=form.elements[k];if(!el)continue;let val=v[k];
    if((k==='lat'||k==='lon')&&val!==null&&val!==undefined&&val!=='')val=(+val).toFixed(4);
    el.value=val??'';}
  if(v.province&&!PROVNAMES.includes(v.province)){const o=document.createElement('option');o.textContent=v.province;form.province.appendChild(o);form.province.value=v.province}
  fillKab(form.province.value,v.regency||'');
  $('#edTitle').textContent=it?(canWrite?'Ubah entri':'Detail entri'):'Entri baru';
  $('#stamp').textContent=it&&it.updatedAt?'Terakhir diperbarui '+new Date(it.updatedAt).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'';
  $('#btnDel').hidden=!it||!canWrite;$('#btnSave').hidden=!canWrite;$('#btnPick').hidden=!canWrite;
  [...form.elements].forEach(el=>el.disabled=!canWrite);
  openEditorPanel();setTimeout(()=>{if(canWrite&&!it)form.elements.name.focus()},220);
}
function closeEditor(){const ed=$('#editor');ed.classList.remove('open');ed.setAttribute('aria-hidden','true');editingId=null;draft=null;pickMode=false;svg.classList.remove('picking');$('#hint').hidden=true;renderMarkers()}
$('#edClose').onclick=closeEditor;$('#btnCancel').onclick=closeEditor;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#loginModal').hidden){$('#loginModal').hidden=true;return}if(pickMode){pickMode=false;svg.classList.remove('picking');$('#hint').hidden=true;openEditorPanel()}else if($('#editor').classList.contains('open'))closeEditor();else hidePop()}});
$('#btnAdd').onclick=()=>{selectedId=null;renderAll();openEditor(null)};
$('#btnPick').onclick=()=>{pickMode=true;svg.classList.add('picking');const ed=$('#editor');ed.classList.remove('open');const h=$('#hint');h.textContent='Klik lokasi di peta. Esc untuk batal.';h.hidden=false;if(window.innerWidth<820)$('#wrap').scrollIntoView({behavior:'smooth'})};
const num=s=>{if(s===''||s==null)return null;const n=parseFloat(String(s).replace(/\s/g,'').replace(/,(?=\d{1,6}$)/,'.').replace(/[^0-9.\-eE]/g,''));return isFinite(n)?n:null};
form.onsubmit=e=>{e.preventDefault();save()};
$('#btnSave').onclick=save;
async function save(){
  if(!canWrite)return;
  const name=form.elements.name.value.trim();if(!name){form.elements.name.focus();toast('Isi nama terlebih dahulu.');return}
  const d={};for(const k of FIELDS){if(k==='kind'){d.kind=(form.querySelector('input[name=kind]:checked')||{}).value||'peluang';continue}d[k]=form.elements[k].value.trim()}
  d.name=name;d.value=num(d.value);d.prob=num(d.prob);if(d.prob!==null)d.prob=Math.max(0,Math.min(100,Math.round(d.prob)));d.lat=num(d.lat);d.lon=num(d.lon);
  if(d.lat!==null&&(d.lat<-15||d.lat>10)){toast('Lintang harus di antara -15 dan 10.');return}
  if(d.lon!==null&&(d.lon<90||d.lon>145)){toast('Bujur harus di antara 90 dan 145.');return}
  d.updatedAt=new Date().toISOString();
  const id=editingId||('p-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const btn=$('#btnSave');btn.disabled=true;
  try{await putItem(id,d);selectedId=id;closeEditor();renderAll();toast('Tersimpan.')}
  catch(err){handleWriteErr(err)}finally{btn.disabled=false}
}
let delConfirm=false;
$('#btnDel').onclick=async()=>{
  if(!editingId)return;if(!delConfirm){delConfirm=true;$('#btnDel').textContent='Klik lagi untuk menghapus';return}
  const id=editingId;try{await delItem(id);if(selectedId===id)selectedId=null;closeEditor();renderAll();toast('Entri dihapus.')}catch(err){handleWriteErr(err)}
};

/* ---------- storage (Supabase) ---------- */
const COLS=['name','kind','sector','status','stage','prob','client','partner','value','currency','deadline','pic','province','regency','lat','lon','notes'];
function toRow(id,d){const r={id};for(const k of COLS){let v=d[k];if(v===''&&['deadline','prob','value','lat','lon'].includes(k))v=null;r[k]=v===undefined?null:v}
  r.updated_at=d.updatedAt||new Date().toISOString();r.updated_by=session&&session.user?session.user.email:null;return r}
function fromRow(r){const o={id:r.id};for(const k of COLS)o[k]=r[k]===null||r[k]===undefined?(['prob','value','lat','lon'].includes(k)?null:''):r[k];
  for(const k of ['prob','value','lat','lon'])if(o[k]!==null)o[k]=Number(o[k]);o.updatedAt=r.updated_at||'';return normItem(o)}
async function fetchAll(){
  const table=session?'projects':'projects_public';
  const {data,error}=await sb.from(table).select('*').limit(5000);
  if(error){console.error(error);showError('Gagal memuat data: '+error.message);return}
  $('#sync').style.color='';
  items=new Map(data.map(r=>[r.id,fromRow(r)]));mode='db';renderAll();
}
async function putItem(id,d){
  const {error}=await sb.from('projects').upsert(toRow(id,d));
  if(error)throw error; items.set(id,{id,...d});
}
async function delItem(id){
  const {error}=await sb.from('projects').delete().eq('id',id);
  if(error)throw error; items.delete(id);
}
function showError(msg){setSync(msg);$('#sync').style.color='var(--warn)';const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},12000)}
function handleWriteErr(err){
  console.error(err);const m=(err&&(err.message||err.code))||'';
  if(/row-level security|permission|JWT|401|403/i.test(m)){showError('Tidak punya izin menulis ke database: '+m)}
  else showError('Gagal menyimpan: '+m);
}
function setSync(t){
  const el=$('#sync');if(t){el.textContent=t;return}
  if(window.CFG_ERR){el.textContent=window.CFG_ERR;return}
  el.textContent=mode==='loading'?'Memuat data…':session?('Masuk sebagai '+session.user.email):'Mode lihat publik';
}
function applyWriteState(){
  canWrite=!!session;
  ['#btnAdd','#btnImport','#btnLogout'].forEach(s=>$(s).hidden=!canWrite);$('#btnLogin').hidden=canWrite;
  document.querySelectorAll('.priv').forEach(el=>el.hidden=!canWrite);
  setSync();renderList();
}
let rtChannel=null,refT=null;
const refetchSoon=()=>{clearTimeout(refT);refT=setTimeout(fetchAll,400)};
function subscribeRealtime(){
  if(rtChannel){sb.removeChannel(rtChannel);rtChannel=null}
  if(!session)return;
  rtChannel=sb.channel('projects-changes').on('postgres_changes',{event:'*',schema:'public',table:'projects'},refetchSoon).subscribe();
}
async function initStore(){
  const cfg=window.APP_CONFIG||{};
  if(!window.supabase||!cfg.SUPABASE_URL||/XXXX/.test(cfg.SUPABASE_URL)||/PASTE/.test(cfg.SUPABASE_ANON_KEY)){
    mode='db';window.CFG_ERR=window.supabase?'Supabase belum dikonfigurasi: isi SUPABASE_URL dan SUPABASE_ANON_KEY di index.html.':'Library Supabase gagal dimuat. Periksa koneksi internet.';renderAll();return}
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  const {data}=await sb.auth.getSession();session=data.session;applyWriteState();
  sb.auth.onAuthStateChange((_e,s)=>{const changed=(!!s)!==(!!session);session=s;if(changed){applyWriteState();fetchAll();subscribeRealtime()}});
  await fetchAll();subscribeRealtime();
  setInterval(()=>{if(!document.hidden)fetchAll()},120000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)fetchAll()});
}
/* login */
$('#btnLogin').onclick=()=>{if(!sb){toast('Supabase belum dikonfigurasi.');return}$('#loginErr').hidden=true;$('#loginModal').hidden=false;$('#loginForm').email.focus()};
$('#loginCancel').onclick=()=>{$('#loginModal').hidden=true};
$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=e.target;$('#loginGo').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.password.value});
  $('#loginGo').disabled=false;
  if(error){$('#loginErr').textContent='Email atau kata sandi salah.';$('#loginErr').hidden=false;return}
  f.password.value='';$('#loginModal').hidden=true;toast('Berhasil masuk.')};
$('#btnLogout').onclick=async()=>{await sb.auth.signOut();closeEditor();toast('Anda sudah keluar.')};

/* ---------- CSV ---------- */
const CSVCOLS=[['id','id'],['nama','name'],['jenis','kind'],['sektor','sector'],['status','status'],['tahap_tender','stage'],['probabilitas','prob'],['provinsi','province'],['kabupaten_kota','regency'],['lintang','lat'],['bujur','lon'],['klien','client'],['mitra','partner'],['nilai','value'],['mata_uang','currency'],['tenggat','deadline'],['pic','pic'],['catatan','notes'],['diperbarui','updatedAt']];
const csvCell=v=>{v=v===null||v===undefined?'':String(v);return/[",\n\r;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function toCSV(){
  const rows=[CSVCOLS.map(c=>c[0]).join(',')];
  for(const i of filtered()){rows.push(CSVCOLS.map(([,k])=>{let v=i[k];if(k==='kind')v=kindLabel(v);if(k==='sector')v=sec(v).label;if(k==='status')v=stLabel(v);if(k==='stage')v=v?stageLabel(v):'';return csvCell(v)}).join(','))}
  return '\ufeff'+rows.join('\r\n');
}
$('#btnExport').onclick=async()=>{
  if(!items.size){toast('Belum ada data untuk diekspor.');return}
  const data=toCSV(),filename='proyek-peluang-indonesia-'+new Date().toISOString().slice(0,10)+'.csv';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
};
function parseCSV(t){
  t=t.replace(/^\ufeff/,'');const first=t.split(/\r?\n/)[0]||'';const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=ch}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
const matchId=(arr,v,def)=>{if(!v)return def;const s=v.trim().toLowerCase();const f=arr.find(a=>a.id===s||a.label.toLowerCase()===s);return f?f.id:def};
$('#btnImport').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  const rows=parseCSV(await file.text());if(rows.length<2){toast('File CSV kosong atau tidak terbaca.');return}
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const keyOf=h=>{const c=CSVCOLS.find(([a,b])=>a===h||b.toLowerCase()===h);return c?c[1]:null};
  const keys=head.map(keyOf);if(!keys.includes('name')){toast('Kolom "nama" tidak ditemukan di CSV.');return}
  if(!session){toast('Masuk dulu sebelum impor.');return}
  const batch=[];let skipped=0;toast('Mengimpor…');
  for(const r of rows.slice(1)){
    const o={};keys.forEach((k,i)=>{if(k)o[k]=(r[i]??'').trim()});if(!o.name){skipped++;continue}
    const id=o.id&&/^[A-Za-z0-9_\-.~:@+]{1,100}$/.test(o.id)?o.id:('p-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    const d={name:o.name,kind:matchId(KINDS,o.kind,'peluang'),sector:matchId(SECTORS,o.sector,'other'),status:matchId(STATUSES,o.status,'identifikasi'),stage:matchId(STAGES.filter(s=>s.id),o.stage,''),prob:(()=>{const n=num((o.prob||'').replace('%',''));return n===null?null:Math.max(0,Math.min(100,Math.round(n)))})(),province:PROV_ALIAS[o.province]||o.province||(o.regency&&KAB2PROV[o.regency.toLowerCase()])||'',regency:o.regency||'',lat:num(o.lat),lon:num(o.lon),client:o.client||'',partner:o.partner||'',value:num(o.value),currency:(o.currency||'IDR').toUpperCase().slice(0,3),deadline:/^\d{4}-\d{2}-\d{2}$/.test(o.deadline||'')?o.deadline:'',pic:o.pic||'',notes:o.notes||'',updatedAt:new Date().toISOString()};
    batch.push(toRow(id,d));
  }
  if(!batch.length){showError('Tidak ada baris yang bisa diimpor: kolom "nama" kosong di semua baris.');return}
  const {error}=await sb.from('projects').upsert(batch);
  if(error){console.error(error);showError('Impor gagal: '+(error.message||error.code)+(error.hint?' ('+error.hint+')':''));return}
  await fetchAll();toast(`${batch.length} entri diimpor`+(skipped?`, ${skipped} baris dilewati (nama kosong)`:'')+'.');
};

let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2800)}

buildMap();initFilters();fit();renderAll();
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(fit,120)});
initStore();
</script>
